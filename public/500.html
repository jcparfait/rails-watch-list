<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Reelist — Something went wrong</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff6e5;
        background:
          radial-gradient(circle at 18% 10%, rgba(139, 42, 60, 0.48), transparent 30%),
          radial-gradient(circle at 88% 22%, rgba(243, 215, 143, 0.16), transparent 28%),
          linear-gradient(135deg, #2b1620 0%, #160b12 52%, #211018 100%);
      }
      main {
        width: min(90vw, 720px);
        padding: 56px;
        border: 1px solid rgba(243, 215, 143, 0.28);
        border-radius: 36px;
        background: linear-gradient(180deg, rgba(255, 246, 229, 0.12), rgba(255, 246, 229, 0.055));
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.32);
      }
      .code {
        color: #f3d78f;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 18px;
        font-size: clamp(42px, 8vw, 86px);
        line-height: 0.98;
        letter-spacing: -0.07em;
      }
      p {
        max-width: 540px;
        color: rgba(255, 246, 229, 0.78);
        font-size: 18px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 24px;
        padding: 0 22px;
        border-radius: 999px;
        color: #211018;
        background: #f3d78f;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">500 · Reelist</div>
      <h1>The projector stopped.</h1>
      <p>Something went wrong while loading Reelist. The app is still here — try again in a moment or return to the library.</p>
      <a href="/">Back to Reelist</a>
    </main>
  </body>
</html>
